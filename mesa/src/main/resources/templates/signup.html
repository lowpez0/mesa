<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Mesa</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<header>
    <a href="/mesa/homepage" class="logo">
        <img src="/images/mesa-logo.png" alt="Mesa Logo">
    </a>
</header>

<main>
    <div class="auth-container">
        <h1>Sign Up</h1>

        <div th:if="${error}" class="error-message" th:text="${error}"></div>

        <form th:action="@{/mesa/signup}" method="post" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit">Create Account</button>
        </form>

        <p class="auth-link">
            Already have an account? <a href="/mesa/login">Log In</a>
        </p>
    </div>
</main>

<footer>
    <img src="/images/mesa-logo.png" alt="Mesa Logo">
    <p>All rights reserved 2026.</p>
</footer>
</body>
</html>
